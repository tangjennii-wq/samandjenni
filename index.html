<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sam & Jenni · Save the Weekend · March 19–20, 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #E2CA23;
    --gold-soft: #C9A537;
    --ivory: #FAF3E0;
    --ivory-dim: rgba(250, 243, 224, 0.7);
    --peach: #F4B5A5;
    --dark: #0D0905;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Figtree', system-ui, -apple-system, sans-serif;
    background: var(--dark);
    color: var(--ivory);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .cinema {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    min-height: 0;
  }
  @media (max-width: 720px) {
    .cinema { padding: 14px; }
  }

  /* Stage sizes to whichever viewport dimension binds first */
  .stage {
    aspect-ratio: 16 / 10;
    width: min(1200px, 92vw, calc((100vh - 64px) * 1.6));
    position: relative;
    background: #000;
    overflow: hidden;
    box-shadow: 0 18px 60px rgba(0,0,0,0.6), 0 4px 16px rgba(0,0,0,0.4);
  }
  .stage video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  /* Subtle film vignette */
  .stage::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 62%, rgba(0,0,0,0.3) 100%);
  }

  /* Upper-right CTA stack — text-style, no capsules */
  .video-controls {
    position: absolute;
    top: 28px;
    right: 28px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
    z-index: 3;
    text-align: right;
  }
  @media (max-width: 640px) {
    .video-controls { top: 16px; right: 16px; gap: 8px; }
  }

  .cta-text {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: 'Figtree', sans-serif;
    text-transform: uppercase;
    color: var(--ivory);
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px 0;
    position: relative;
    text-shadow: 0 1px 8px rgba(0,0,0,0.4);
    transition: opacity 0.2s;
  }
  /* Underline reveal on hover */
  .cta-text::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 1px;
    background: currentColor;
    transform: scaleX(0.35);
    transform-origin: right;
    opacity: 0.55;
    transition: transform 0.32s ease-out, opacity 0.25s;
  }
  .cta-text:hover::after { transform: scaleX(1); opacity: 1; }

  .cta-primary {
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.28em;
    color: var(--ivory);
  }
  .cta-primary:hover { color: #fff; }
  .cta-primary svg { width: 14px; height: 14px; }

  /* When sound is on, primary becomes the quieter state */
  .cta-primary.is-on {
    font-size: 11px;
    font-weight: 400;
    opacity: 0.72;
    letter-spacing: 0.24em;
  }
  .cta-primary.is-on:hover { opacity: 1; }
  .cta-primary.is-on svg { width: 12px; height: 12px; }

  .cta-secondary {
    font-weight: 400;
    font-size: 11px;
    letter-spacing: 0.28em;
    color: var(--ivory);
    opacity: 0.7;
  }
  .cta-secondary:hover { opacity: 1; }
  .cta-secondary .arrow {
    transition: transform 0.22s;
    font-size: 12px;
    line-height: 1;
  }
  .cta-secondary:hover .arrow { transform: translateX(4px); }

  /* "formal invitation to follow" — inside video, deeper into lower-right, full gold */
  .fit-caption {
    position: absolute;
    bottom: 18px;
    right: 22px;
    z-index: 3;
    color: var(--gold);
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 0.38em;
    text-transform: lowercase;
    opacity: 0.92;
    text-shadow: 0 1px 8px rgba(0,0,0,0.55);
    pointer-events: none;
  }
  @media (max-width: 640px) {
    .fit-caption { bottom: 10px; right: 12px; font-size: 10px; letter-spacing: 0.28em; }
  }

  /* Modal for full reel */
  .modal { position: fixed; inset: 0; background: rgba(13, 9, 5, 0.95); display: none; align-items: center; justify-content: center; z-index: 100; padding: 32px; }
  .modal.open { display: flex; }
  .modal-inner { background: #000; max-width: 1100px; width: 100%; border: 2px solid var(--peach); border-radius: 2px; position: relative; }
  .modal video { width: 100%; height: auto; display: block; }
  .modal-close { position: absolute; top: -18px; right: -18px; background: var(--ivory); color: var(--dark); border: none; width: 40px; height: 40px; border-radius: 999px; cursor: pointer; font-size: 18px; font-weight: 700; line-height: 1; box-shadow: 0 4px 18px rgba(0,0,0,0.5); }
</style>
</head>
<body>

  <main class="cinema">
    <div class="stage">
      <video id="heroVideo" src="video-variants/jM_mid2_titled_original.mp4" muted autoplay loop playsinline preload="auto"></video>

      <div class="video-controls">
        <button class="cta-text cta-primary" id="soundBtn" type="button" aria-label="Turn sound on">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/></svg>
          <span id="soundLabel">Sound on</span>
        </button>
        <button class="cta-text cta-secondary" type="button" id="openReel">
          <span>Watch full reel</span>
          <span class="arrow" aria-hidden="true">→</span>
        </button>
      </div>

      <p class="fit-caption">formal invitation to follow</p>
    </div>
  </main>

  <div class="modal" id="reel" role="dialog" aria-modal="true">
    <div class="modal-inner">
      <button class="modal-close" type="button" aria-label="Close" id="closeReel">×</button>
      <video id="reelVideo" src="video-variants/jM_long_clean.mp4" controls preload="metadata" playsinline></video>
    </div>
  </div>

  <script>
    (function () {
      const hero=document.getElementById('heroVideo'),
            soundBtn=document.getElementById('soundBtn'),
            soundLbl=document.getElementById('soundLabel'),
            openReel=document.getElementById('openReel'),
            closeReel=document.getElementById('closeReel'),
            modal=document.getElementById('reel'),
            reelVid=document.getElementById('reelVideo');
      function setSound(on){
        if(on){ hero.muted=false; hero.currentTime=0; hero.play().catch(()=>{}); soundBtn.classList.add('is-on'); soundBtn.setAttribute('aria-label','Turn sound off'); soundLbl.textContent='Sound off'; }
        else { hero.muted=true; soundBtn.classList.remove('is-on'); soundBtn.setAttribute('aria-label','Turn sound on'); soundLbl.textContent='Sound on'; }
      }
      soundBtn.addEventListener('click', () => setSound(hero.muted));
      function openModal(){ modal.classList.add('open'); hero.pause(); reelVid.currentTime=0; reelVid.play().catch(()=>{}); }
      function closeModal(){ modal.classList.remove('open'); reelVid.pause(); hero.play().catch(()=>{}); }
      openReel.addEventListener('click', openModal);
      closeReel.addEventListener('click', closeModal);
      document.addEventListener('keydown', e => { if(e.key==='Escape' && modal.classList.contains('open')) closeModal(); });
      modal.addEventListener('click', e => { if(e.target===modal) closeModal(); });
    })();
  </script>

</body>
</html>
