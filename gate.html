<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta property="og:type" content="website">
<meta property="og:url" content="https://samandjenni.com/">
<meta property="og:site_name" content="shlang wedding">
<meta property="og:title" content="sam + jenni">
<meta property="og:description" content="a private page for our guests">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="sam + jenni">
<meta name="twitter:description" content="a private page for our guests">
<meta name="robots" content="noindex, nofollow">
<title>shlang wedding</title>
<meta name="description" content="sam + jenni · march 19–20, 2027 · new york city">
<!-- Link previews are generated here, not on the home page: every crawler is
     redirected to /gate because it has no sign-in cookie. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--red:#E53C2D;--gold:#E5C822;--ivory:#FAF3E0;--dark:#0D0905;--white:#fff}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
    background:var(--dark);color:var(--dark);
    font-family:'Figtree',system-ui,sans-serif;padding:28px;overflow:hidden}
  /* Film playing behind the gate */
  .bgvid{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
  .bgtint{position:fixed;inset:0;background:rgba(13,9,5,.35);z-index:-1}
  .card{width:100%;max-width:440px;text-align:center;
    border:2px solid var(--dark);border-radius:22px;overflow:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,.35);background:var(--white)}
  .band{background:var(--red);color:#fff;font-size:10px;font-weight:800;letter-spacing:.3em;
    text-transform:uppercase;padding:13px}
  .box{padding:46px 34px 40px;background:var(--white)}
  /* Figtree Light, to match the wordmark on every other page. gate.html does
     not load site.css, so the light pass never reached it. */
  h1{font-size:40px;font-weight:300;letter-spacing:.14em;text-transform:uppercase;
    color:var(--dark);line-height:1.05}
  h1 .plus{color:var(--red)}
  .sub{margin-top:13px;font-size:10.5px;font-weight:800;letter-spacing:.3em;
    text-transform:uppercase;color:var(--red)}
  .date{margin-top:20px;font-size:16px;font-weight:700;letter-spacing:.1em;color:#8a7863}
  form{margin-top:32px;display:flex;flex-direction:column;gap:12px;text-align:left}
  label{font-size:10px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:#a2907a;margin-bottom:-4px}
  input{border:2px solid var(--dark);border-radius:14px;background:#fbf7ef;color:var(--dark);
    font-family:inherit;font-size:16px;padding:15px 16px;text-align:center;letter-spacing:.06em;outline:none}
  /* Near-black, not the old #c9b8a2. At 2.0:1 that placeholder was below
     every legibility threshold there is -- on the hero film behind it the
     field read as empty and unlabelled. A hair off pure black so it still
     reads as a prompt rather than a value already typed. */
  /* Faded black, not the old warm tan (#c9b8a2, about 2:1 -- below every
     legibility threshold there is). Black at 62% reads clearly while still
     sitting visibly lighter than a typed value, so the field never looks
     as though it is already filled in. */
  input::placeholder{color:rgba(26,26,26,.62);opacity:1;letter-spacing:.02em;font-size:15px}
  input:focus{border-color:var(--red);background:#fff}
  button{margin-top:6px;border:2px solid var(--dark);border-radius:14px;background:var(--gold);color:var(--dark);
    font-family:inherit;font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;
    padding:16px;cursor:pointer;transition:background .15s,color .15s}
  button:hover{background:var(--red);color:#fff;border-color:var(--red)}
  .err{margin-top:16px;font-size:12.5px;color:var(--red);font-weight:600;display:none}
  .err.show{display:block}
  .hint{margin-top:26px;font-size:11.5px;color:#a2907a;font-style:italic;line-height:1.7}
  .skip{ display:inline-block; margin-top:16px; font-size:12px; letter-spacing:.02em;
    color:#a2907a; text-decoration:none; border-bottom:1px solid transparent; }
  .skip:hover{ color:var(--dark); border-bottom-color:#a2907a; }
  /* ---- cleaned up to match the phone home page --------------------------
     Order is city, then the names, then the date — the same reading order as
     the crest. The red band came off: the card is white with one red accent
     (the label and the +), which is how the rest of the site behaves. */
  .card{ border-radius:18px; overflow:hidden; }
  .box{ padding:34px 26px 28px; }
  .sub{ margin-bottom:12px; font-size:10.5px; font-weight:800; letter-spacing:.22em;
    text-transform:uppercase; color:var(--red); }
  h1{ margin:0; font-size:34px; letter-spacing:.14em; }
  .date{ margin-top:10px; font-size:15px; letter-spacing:.16em; color:#8a7967; }
  form{ margin-top:26px; }
  .sr-only{ position:absolute; width:1px; height:1px; margin:-1px; padding:0;
    overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
  input{ border-radius:14px; background:#fff; text-align:center; border-width:1.5px; }
  /* "Find it" read like a search engine. The button says the same thing as the
     label above it, which is the plainest way to be sure. */
  button[type=submit]{ border-radius:14px; background:var(--red); color:#fff;
    border:0; font-size:11px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; }
  button[type=submit]:hover{ background:var(--dark); }
  /* plain black sentences rather than italic grey asides */
  .hint{ margin-top:20px; font-size:13px; line-height:1.65; font-style:normal;
    color:var(--dark); }
  /* bottom-right, so it lines up with the right edge of the field and button
     above it rather than floating in the middle */
  .gate-foot{ display:flex; justify-content:flex-end; margin-top:16px; }
  .gate-foot .skip{ margin-top:0; font-size:12.5px; color:#8a7967; }
</style>
</head>
<body>
  <video class="bgvid" autoplay muted loop playsinline poster="poster.jpg">
    <source src="hero.mp4" type="video/mp4">
  </video>
  <div class="bgtint"></div>

  <div class="card">
    <div class="box">
      <div class="sub">The Pierre &middot; New York, New York</div>
      <h1>Sam <span class="plus">+</span> Jenni</h1>
      <div class="date">3.20.27</div>

      <form method="POST" action="/api/login" id="gateform">
        <!-- The visible label said the same words as the button directly below
             it. Kept for screen readers only, since the field still needs a
             name — the placeholder alone isn't an accessible label. -->
        <label class="sr-only" for="lastname">Your e-mail</label>
        <input id="lastname" name="lastname" type="email" autocomplete="email" autofocus
               inputmode="email" placeholder="your e-mail"
               spellcheck="false" autocapitalize="off" />
        <button type="submit">Find my invitation &rarr;</button>
      </form>

      <div class="err" id="err"></div>
      <p class="hint">Enter your e-mail (the one we have on file).<br>
        Different email, or can&rsquo;t get in? Text us and we&rsquo;ll sort it.</p>
      <!-- No "have a look around first" link: with the whole site private there
           is nowhere for it to go. The .skip / .gate-foot styles below are left
           in place deliberately — this has been on and off twice now, so
           putting it back is one line of markup rather than a rebuild. -->

    </div>
  </div>
<script>
  // Carry ?next= from the middleware redirect through to the login endpoint, so
  // a guest who clicked "hotels" while signed out lands on hotels rather than
  // the home page. The form posts to a fixed action, and login reads next off
  // the URL rather than the body, so it has to go on the action.
  // Allow-listed here as well as server-side — belt and braces against
  // reflecting something arbitrary into the redirect.
  (function () {
    var OK = ['index','weekend','recommendations','travel','faq','rsvp','over-under','stay'];
    var m = location.search.match(/[?&]next=([^&]*)/);
    if (!m) return;
    var want = decodeURIComponent(m[1]).replace(/\.html$/, '');
    if (OK.indexOf(want) === -1) return;
    var f = document.getElementById('gateform');
    if (f) f.action = '/api/login?next=' + encodeURIComponent(want);
  })();

  // Read once, up here: the first-name block below needs it, and `var` would
  // otherwise hoist the name but not the value.
  var e = new URLSearchParams(location.search).get('e');

  var MSG = {
    pass: "we can't find that one — try the email we sent this to ♡",
    name: "we just need your email ♡",
    email: "the site opens with your email now — the address we sent this to ♡",
    list: "we can't find that email — it may be a different one to the address we have. text us and we'll add it ♡"
  };

  /* ── a surname shared by several guests ─────────────────────────────────
     login.js bounces back here with ?e=first when the name typed is a bare
     surname that several households answer to — Lee is ten people, Tang is
     six. Signing them in on the surname alone was a silent downgrade: they
     saw the events for the safe fallback tier and nothing said why.

     The surname arrives in ?s= so the message can name it. It came from user
     input, so it is re-validated here and written with textContent, never
     innerHTML — echoing a query parameter into markup is how you get an
     injection. The form also carries retry=1 from here, so if they really do
     only have a surname on our list, the second attempt lets them straight in
     rather than asking again forever. */
  (function () {
    if (e !== 'first') return;
    var raw = (new URLSearchParams(location.search).get('s') || '').toLowerCase();
    var sn  = /^[a-z' ]{1,40}$/.test(raw) ? raw : '';
    var nice = sn ? sn.replace(/\b[a-z]/g, function (c) { return c.toUpperCase(); }) : '';

    var box = document.getElementById('err');
    box.textContent = nice
      ? 'We have a few ' + nice + 's on the list — what\u2019s your first name?'
      : 'We have a few of you on the list — could we have your first name too?';
    box.classList.add('show');

    var hint = document.querySelector('.hint');
    if (hint) {
      hint.textContent = nice
        ? 'Try your full name, like Jenni ' + nice + '.'
        : 'Try your full name.';
    }

    var f = document.getElementById('lastname');
    if (f) {
      // Prefill the surname and put the caret at the front, so adding the
      // first name is one word of typing rather than retyping the whole thing.
      f.value = nice;
      f.placeholder = nice ? 'first name ' + nice : 'your full name';
      f.focus();
      try { f.setSelectionRange(0, 0); } catch (err) {}
    }

    var form = document.getElementById('gateform');
    if (form) form.action += (form.action.indexOf('?') > -1 ? '&' : '?') + 'retry=1';
  })();
  // Only real problems speak now. ?e=private is gone along with the link that
  // pointed at it, so an unknown ?e falls back to the normal not-found message.
  // 'first' is handled above, with its own message and a prefilled field.
  if (e && e !== 'first') {
    var box = document.getElementById('err');
    box.textContent = MSG[e] || MSG.pass;
    box.classList.add('show');
    var f = document.getElementById('lastname');
    if (f) f.focus();
  }
</script>
</body>
</html>
