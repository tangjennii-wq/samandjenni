<head>

<title>shlang wedding</title>

<!-- Link previews are generated here, not on the home page: every crawler is
     redirected to /gate because it has no sign-in cookie. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* ==========================================================================
     The gate, in the same language as the sheets: flat white, no card, no
     border, no shadow, nothing floating over anything. Previously a bordered,
     shadowed card sitting on the film — three surfaces stacked before you
     reached the one input.

     The film is gone from behind it. It's one line to bring back (uncomment
     .bgvid/.bgtint and the <video> below), but a stark white page is what makes
     this read as the same site as the RSVP and note sheets.

     Type ladder matches those sheets exactly:
       eyebrow  10.5px / 800 / .22em  red
       name     42px   / 800 / .02em
       date     15px   / 700 / .16em  muted
       field    17px   / 400           underline, not a box
       button   11px   / 800 / .16em
     ========================================================================== */
  :root{--red:#E53C2D;--dark:#0D0905;--line:rgba(13,9,5,.14)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
    background:#fff;color:var(--dark);
    font-family:'Figtree',system-ui,sans-serif;padding:28px;
    -webkit-font-smoothing:antialiased}
  .bgvid,.bgtint{display:none}

  .card{width:100%;max-width:420px;text-align:center;
    background:none;border:0;border-radius:0;box-shadow:none;overflow:visible}
  .box{padding:0;background:none}

  .sub{margin-bottom:14px;font-size:10.5px;font-weight:800;letter-spacing:.22em;
    text-transform:uppercase;color:var(--red)}
  h1{margin:0;font-size:42px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;
    color:var(--dark);line-height:1.02}
  h1 .plus{color:var(--red)}
  .date{margin-top:12px;font-size:15px;font-weight:700;letter-spacing:.16em;color:#8a7967}

  form{margin-top:38px;display:flex;flex-direction:column;gap:22px;text-align:left}
  .sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;
    overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

  /* an underline, like every field in the sheets */
  input{border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;
    color:var(--dark);font-family:inherit;font-size:17px;font-weight:400;
    padding:10px 2px;text-align:center;letter-spacing:0;outline:none;
    transition:border-color .15s}
  input::placeholder{color:#bcae9b;font-size:17px;letter-spacing:0}
  input:focus{border-bottom-color:var(--red)}

  /* the same centred pill the sheets use */
  button[type=submit]{display:flex;align-items:center;justify-content:center;
    width:fit-content;min-width:190px;max-width:100%;height:48px;padding:0 36px;
    margin:0 auto;border:0;border-radius:999px;background:var(--red);color:#fff;
    font-family:inherit;font-size:11px;font-weight:800;letter-spacing:.16em;
    text-transform:uppercase;cursor:pointer;transition:background .15s}
  button[type=submit]:hover{background:var(--dark)}

  .err{margin-top:18px;font-size:13px;color:var(--red);font-weight:600;display:none;
    text-align:center}
  .err.show{display:block}
  .hint{margin-top:26px;font-size:13px;line-height:1.65;color:#8a7967;text-align:center}

  /* kept in place: this link has been on and off twice, so restoring it is one
     line of markup rather than a rebuild */
  .skip{display:inline-block;margin-top:16px;font-size:12.5px;color:#8a7967;
    text-decoration:none;border-bottom:1px solid transparent}
  .skip:hover{color:var(--dark);border-bottom-color:#8a7967}
  .gate-foot{display:flex;justify-content:center;margin-top:16px}

  @media (max-width:560px){
    body{padding:24px}
    h1{font-size:32px}
    .sub{font-size:9.5px;letter-spacing:.18em;margin-bottom:11px}
    .date{margin-top:10px;font-size:13.5px}
    form{margin-top:30px;gap:18px}
    .hint{margin-top:22px;font-size:12.5px}
  }
</style>
</head>
<body>
  <video class="bgvid" autoplay muted loop playsinline poster="poster.jpg">
    <source src="hero.mp4" type="video/mp4">
  </video>
  <div class="bgtint"></div>

  <div class="card">
    <div class="box">
      <div class="sub">The Pierre &middot; New York, New York</div>
      <h1>Sam <span class="plus">+</span> Jenni</h1>
      <div class="date">3.20.27</div>

      <form method="POST" action="/api/login" id="gateform">
        <!-- The visible label said the same words as the button directly below
             it. Kept for screen readers only, since the field still needs a
             name — the placeholder alone isn't an accessible label. -->
        <label class="sr-only" for="lastname">Your full name or email</label>
        <input id="lastname" name="lastname" type="text" autocomplete="name" autofocus
               placeholder="your full name or email" spellcheck="false" autocapitalize="words" />
        <button type="submit">Find my invitation &rarr;</button>
      </form>

      <div class="err" id="err"></div>
      <p class="hint">Enter your full name or the email we sent this to.<br>
        Can&rsquo;t find your invite? Text us.</p>
      <!-- No "have a look around first" link: with the whole site private there
           is nowhere for it to go. The .skip / .gate-foot styles below are left
           in place deliberately — this has been on and off twice now, so
           putting it back is one line of markup rather than a rebuild. -->

    </div>
  </div>
<script>
  // Carry ?next= from the middleware redirect through to the login endpoint, so
  // a guest who clicked "hotels" while signed out lands on hotels rather than
  // the home page. The form posts to a fixed action, and login reads next off
  // the URL rather than the body, so it has to go on the action.
  // Allow-listed here as well as server-side — belt and braces against
  // reflecting something arbitrary into the redirect.
  (function () {
    var OK = ['index','weekend','recommendations','travel','faq','rsvp','over-under','stay'];
    var m = location.search.match(/[?&]next=([^&]*)/);
    if (!m) return;
    var want = decodeURIComponent(m[1]).replace(/\.html$/, '');
    if (OK.indexOf(want) === -1) return;
    var f = document.getElementById('gateform');
    if (f) f.action = '/api/login?next=' + encodeURIComponent(want);
  })();

  var MSG = {
    pass: "we can't find that one — try your full name, or the email we sent this to ♡",
    name: "we just need your name or email ♡",
    list: "we can't find that one — try your full name, or the email we sent this to. still stuck? just text us ♡"
  };
  // Only real problems speak now. ?e=private is gone along with the link that
  // pointed at it, so an unknown ?e falls back to the normal not-found message.
  var e = new URLSearchParams(location.search).get('e');
  if (e) {
    var box = document.getElementById('err');
    box.textContent = MSG[e] || MSG.pass;
    box.classList.add('show');
    var f = document.getElementById('lastname');
    if (f) f.focus();
  }
</script>
</body>
</html>
